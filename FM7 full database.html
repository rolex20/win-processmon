    function renderTable(data) {
        tableBody.innerHTML = "";
        data.forEach(row => {

        const filtered = carData.filter(row => 
            row.some(cell => cell.toString().toLowerCase().includes(text))
        );
        renderTable(filtered);
    });

    // Carga inicial
    renderTable(carData);
